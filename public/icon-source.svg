<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#1b2550"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#080d1a"/>
    </radialGradient>
    <linearGradient id="orb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background so the icon fills the frame edge-to-edge on
       every platform (Android adaptive icons crop to a shape, so there is
       no safe "transparent" margin to rely on). -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Aura orb: kept within the ~80% maskable safe zone (radius <= 205px
       from center at 512px canvas) so it survives circle/squircle masking
       on Android without the mark's edge being clipped. -->
  <circle cx="256" cy="256" r="200" fill="url(#orb)"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="3"/>

  <!-- Monogram "A" — simplified from the promo mark, no small text so it
       stays legible down to a 16px favicon. -->
  <path d="M226 336 L252 190 L262 190 L288 336 L266 336 L259 296 L255 296 L248 336 Z" fill="url(#glyph)"/>
  <path d="M235 270 L279 270 L284 246 L230 246 Z" fill="#4f46e5"/>

  <!-- Presence dot accent, echoes the app's "online now" motif. -->
  <circle cx="332" cy="196" r="14" fill="#ec4899"/>
</svg>
